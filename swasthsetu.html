<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwasthSetu — AI Clinical Intake Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2A3D;
  --ink-soft:#4A6273;
  --primary:#0B6FA4;
  --primary-dark:#074C72;
  --primary-light:#E7F2F8;
  --accent:#E8873A;
  --accent-dark:#C36A24;
  --success:#1F8A5F;
  --success-light:#E6F5EE;
  --danger:#C23B3B;
  --danger-light:#FBEAEA;
  --warning:#C98A1D;
  --warning-light:#FCF3E1;
  --bg:#F3F7F9;
  --card:#FFFFFF;
  --border:#DCE6EA;
  --radius:16px;
  --shadow:0 4px 18px rgba(15,42,61,0.07);
  --shadow-lg:0 12px 34px rgba(15,42,61,0.14);
  --font-display:'Poppins',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-hi:'Noto Sans Devanagari','Inter',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body), var(--font-hi);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.hi *{font-family:var(--font-hi), var(--font-body);}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--accent); color:#fff;}

/* ---------- top bar (role switch, only chrome shared across modes) ---------- */
.rolebar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 22px; background:var(--primary-dark); color:#fff;
  font-family:var(--font-display); font-size:13px;
}
.rolebar .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; letter-spacing:.2px;}
.rolebar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
.rolebar nav{display:flex; gap:4px; background:rgba(255,255,255,.08); padding:4px; border-radius:10px;}
.rolebar nav button{
  border:none; background:transparent; color:#cfe4f0; padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
  transition:.15s;
}
.rolebar nav button.active{background:var(--accent); color:#fff;}
.rolebar .meta{font-size:11.5px; color:#a9c7d8; display:flex; gap:10px; align-items:center;}
.badge-live{display:inline-flex;align-items:center;gap:5px;background:rgba(31,138,95,.18);color:#8be0b8;padding:3px 9px;border-radius:20px;font-weight:700;}
.badge-live .pulse{width:7px;height:7px;border-radius:50%;background:#37d489;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,212,137,.6)}70%{box-shadow:0 0 0 7px rgba(55,212,137,0)}100%{box-shadow:0 0 0 0 rgba(55,212,137,0)}}

/* ================= PATIENT KIOSK MODE ================= */
.kiosk-wrap{
  min-height:calc(100vh - 46px);
  display:flex; align-items:center; justify-content:center; padding:26px 16px;
  background:
    radial-gradient(circle at 12% 15%, rgba(11,111,164,.06), transparent 45%),
    radial-gradient(circle at 88% 85%, rgba(232,135,58,.07), transparent 45%),
    var(--bg);
}
.kiosk-card{
  width:100%; max-width:640px; background:var(--card); border-radius:26px; box-shadow:var(--shadow-lg);
  border:1px solid var(--border); overflow:hidden; position:relative;
}
.kiosk-card.wide{max-width:900px;}
.kiosk-topstrip{height:6px; background:linear-gradient(90deg,var(--primary),var(--accent));}
.kiosk-body{padding:34px 34px 30px;}
.k-eyebrow{
  font-family:var(--font-display); font-size:11.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--primary); display:flex; align-items:center; gap:8px; margin-bottom:10px;
}
.k-eyebrow::before{content:''; width:16px; height:2px; background:var(--accent); display:inline-block; border-radius:2px;}
.k-title{font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1.28; color:var(--ink); margin-bottom:8px;}
.k-sub{color:var(--ink-soft); font-size:15px; line-height:1.55; margin-bottom:22px;}
.k-progress{display:flex; gap:5px; margin-bottom:24px;}
.k-progress span{height:5px; flex:1; background:var(--border); border-radius:4px; overflow:hidden;}
.k-progress span i{display:block; height:100%; background:var(--primary); width:0; transition:width .4s;}
.k-progress span.done i{width:100%;}
.k-progress span.now i{width:55%; background:var(--accent);}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr 1fr;}}

.tile{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  background:var(--primary-light); border:2px solid transparent; border-radius:18px; padding:20px 12px;
  min-height:104px; text-align:center; transition:.15s; font-family:var(--font-display); font-weight:600; color:var(--primary-dark); font-size:14.5px;
}
.tile:hover{border-color:var(--primary); transform:translateY(-2px);}
.tile.selected{border-color:var(--accent); background:#FFF3E9; color:var(--accent-dark);}
.tile .ic{font-size:30px;}
.tile.big{min-height:130px; font-size:16px;}
.tile.emergency{background:var(--danger-light); color:var(--danger);}
.tile.emergency:hover{border-color:var(--danger);}

.btn{
  border:none; border-radius:13px; padding:14px 22px; font-weight:700; font-size:15px; font-family:var(--font-display);
  transition:.15s; display:inline-flex; align-items:center; gap:8px; justify-content:center;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-accent{background:var(--accent); color:#fff;}
.btn-accent:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--primary-light); color:var(--primary-dark);}
.btn-ghost:hover{background:#d9ecf6;}
.btn-outline{background:transparent; border:2px solid var(--border); color:var(--ink-soft);}
.btn-outline:hover{border-color:var(--primary); color:var(--primary);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-full{width:100%;}
.btn-lg{padding:18px 24px; font-size:17px; border-radius:16px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.k-actions{display:flex; gap:10px; margin-top:26px;}
.k-footer-links{display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:12.5px; color:var(--ink-soft);}
.k-footer-links button{background:none;border:none;color:var(--ink-soft); text-decoration:underline; font-size:12.5px;}

/* language chips */
.chiprow{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;}
.chip{padding:10px 18px; border-radius:30px; border:2px solid var(--border); background:#fff; font-weight:600; font-size:14px; color:var(--ink-soft);}
.chip.selected{border-color:var(--primary); background:var(--primary-light); color:var(--primary-dark);}

/* mic */
.mic-zone{display:flex; flex-direction:column; align-items:center; gap:14px; padding:26px 10px 10px;}
.mic-btn{
  width:104px; height:104px; border-radius:50%; border:none; background:linear-gradient(145deg,var(--primary),var(--primary-dark));
  color:#fff; font-size:38px; display:flex; align-items:center; justify-content:center; position:relative; box-shadow:0 10px 24px rgba(11,111,164,.35);
}
.mic-btn.listening{background:linear-gradient(145deg,var(--accent),var(--accent-dark)); box-shadow:0 10px 24px rgba(232,135,58,.4);}
.mic-ring{position:absolute; inset:-10px; border-radius:50%; border:3px solid var(--accent); opacity:0; }
.mic-btn.listening .mic-ring{animation:ring 1.2s infinite;}
@keyframes ring{0%{transform:scale(.9); opacity:.8;}100%{transform:scale(1.5); opacity:0;}}
.mic-caption{font-weight:600; color:var(--ink-soft); font-size:14px; text-align:center; min-height:20px;}
.mic-heard{background:var(--primary-light); border-radius:12px; padding:12px 16px; font-size:15px; color:var(--primary-dark); font-weight:600; margin-top:6px; min-height:20px;}

/* body map */
.bodymap-wrap{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.bm-part{background:var(--primary-light); border:2px solid transparent; border-radius:14px; padding:16px; display:flex; align-items:center; gap:10px; font-weight:600; color:var(--primary-dark); font-size:14px;}
.bm-part .ic{font-size:22px;}
.bm-part.selected{border-color:var(--accent); background:#FFF3E9;}

/* questions */
.q-card{background:#fff;}
.q-text{font-family:var(--font-display); font-weight:700; font-size:20px; line-height:1.4; margin-bottom:18px; color:var(--ink);}
.opt-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.opt-btn{
  text-align:left; padding:15px 18px; border-radius:14px; border:2px solid var(--border); background:#fff; font-size:15.5px; font-weight:600; color:var(--ink);
  display:flex; align-items:center; justify-content:space-between;
}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn .yn{font-size:20px;}
.util-row{display:flex; gap:8px; flex-wrap:wrap;}
.util-row button{background:var(--bg); border:1.5px solid var(--border); color:var(--ink-soft); padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600;}

/* red flag alert */
.alert-emergency{
  background:linear-gradient(135deg,#C23B3B,#8E2323); color:#fff; border-radius:22px; padding:34px 30px; text-align:center;
}
.alert-emergency .ic{font-size:46px; margin-bottom:10px;}
.alert-emergency h2{font-family:var(--font-display); font-size:23px; margin-bottom:10px;}
.alert-emergency p{font-size:14.5px; opacity:.95; line-height:1.6; margin-bottom:6px;}
.alert-emergency .tag{display:inline-block; background:rgba(255,255,255,.18); padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700; margin-top:14px; letter-spacing:.4px;}

/* upload */
.doc-drop{border:2.5px dashed var(--border); border-radius:18px; padding:26px; text-align:center; color:var(--ink-soft); margin-bottom:16px;}
.doc-item{display:flex; align-items:center; gap:12px; background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.doc-item .thumb{width:42px;height:42px;border-radius:10px;background:var(--primary-light); display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.doc-item .info{flex:1; font-size:13px;}
.doc-item .info b{display:block; font-size:14px; margin-bottom:2px;}
.conf-tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.conf-high{background:var(--success-light); color:var(--success);}
.conf-low{background:var(--warning-light); color:var(--warning);}
.demo-doc-btn{display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:10px 14px; background:#fff; font-size:13.5px; font-weight:600; color:var(--ink-soft); width:100%; margin-bottom:8px;}
.demo-doc-btn:hover{border-color:var(--primary); color:var(--primary-dark);}

/* summary confirm */
.sum-block{background:var(--bg); border-radius:14px; padding:14px 16px; margin-bottom:10px; font-size:14.5px; line-height:1.6;}
.sum-block b{color:var(--primary-dark);}
.completeness-ring{display:flex; align-items:center; gap:14px; background:var(--success-light); border-radius:16px; padding:16px 18px; margin-bottom:16px;}
.completeness-ring .num{font-family:var(--font-display); font-weight:800; font-size:26px; color:var(--success);}

/* consent */
.consent-box{background:var(--bg); border-radius:14px; padding:16px 18px; font-size:13.5px; line-height:1.7; color:var(--ink-soft); margin-bottom:16px; max-height:170px; overflow:auto;}
.consent-check{display:flex; align-items:flex-start; gap:10px; background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:10px; font-size:14px; cursor:pointer;}
.consent-check input{width:19px;height:19px; margin-top:2px; accent-color:var(--primary);}

/* receipt */
.receipt{background:var(--bg); border:1.5px dashed var(--border); border-radius:16px; padding:22px; text-align:center;}
.receipt .token{font-family:var(--font-display); font-weight:800; font-size:34px; color:var(--primary-dark); margin:8px 0;}
.qr{width:110px;height:110px; margin:14px auto 6px; background:
  repeating-linear-gradient(0deg,#0F2A3D 0 4px, transparent 4px 8px),
  repeating-linear-gradient(90deg,#0F2A3D 0 4px, transparent 4px 8px);
  background-blend-mode:multiply; border-radius:8px; border:6px solid #fff; box-shadow:0 0 0 1.5px var(--border);}

/* accessibility toggles floating */
.access-fab{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:60;}
.access-fab button{width:48px;height:48px;border-radius:50%; border:none; background:var(--ink); color:#fff; font-size:18px; box-shadow:var(--shadow-lg);}
.access-fab button.on{background:var(--accent);}

/* senior / zero-literacy mode scaling */
.senior-mode .kiosk-card{max-width:720px;}
.senior-mode .k-title{font-size:31px;}
.senior-mode .k-sub{font-size:17px;}
.senior-mode .q-text{font-size:24px;}
.senior-mode .opt-btn{font-size:18px; padding:20px 20px;}
.senior-mode .tile{font-size:17px; min-height:120px;}
.senior-mode .btn-lg{font-size:19px; padding:20px 26px;}
.high-contrast{--bg:#000; --card:#0b0b0b; --ink:#fff; --ink-soft:#dcdcdc; --border:#444; --primary-light:#062534;}
.high-contrast .kiosk-card{border:2px solid #fff;}
.high-contrast .opt-btn, .high-contrast .tile{color:#fff;}

/* toast */
.toast{position:fixed; top:60px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 22px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg); z-index:100; opacity:0; transition:.25s;}
.toast.show{opacity:1; top:66px;}

/* ================= DASHBOARD MODE (doctor/triage/admin) ================= */
.dash-wrap{display:flex; min-height:calc(100vh - 46px);}
.sidebar{width:230px; background:#fff; border-right:1px solid var(--border); padding:22px 14px; flex-shrink:0;}
.sidebar h4{font-family:var(--font-display); font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin:16px 8px 8px;}
.side-item{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:3px;}
.side-item.active{background:var(--primary-light); color:var(--primary-dark);}
.side-item .cnt{margin-left:auto; background:var(--border); color:var(--ink-soft); font-size:11px; padding:1px 7px; border-radius:20px; font-weight:700;}
.side-item.active .cnt{background:var(--primary); color:#fff;}
.dash-main{flex:1; padding:26px 30px; overflow:auto;}
.dash-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
.dash-header h1{font-family:var(--font-display); font-size:22px; font-weight:700;}
.dash-header p{color:var(--ink-soft); font-size:13px; margin-top:3px;}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow);}
.stat-card .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.stat-card .val{font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--ink);}
.stat-card .sub{font-size:11.5px; color:var(--success); font-weight:600; margin-top:4px;}

.panel{background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;}
.panel .p-head{padding:16px 20px; border-bottom:1px solid var(--border); font-family:var(--font-display); font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; align-items:center;}
.panel .p-body{padding:18px 20px;}

.queue-row{display:grid; grid-template-columns:70px 1fr 110px 130px 90px; gap:10px; align-items:center; padding:13px 20px; border-bottom:1px solid var(--border); font-size:13.5px; cursor:pointer;}
.queue-row:hover{background:var(--bg);}
.queue-row:last-child{border-bottom:none;}
.token-tag{font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--primary-dark);}
.pri{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:12px; padding:5px 10px; border-radius:20px;}
.pri .dot{width:8px;height:8px;border-radius:50%;}
.pri.RED{background:var(--danger-light); color:var(--danger);}
.pri.RED .dot{background:var(--danger); animation:pulse 1.4s infinite;}
.pri.YELLOW{background:var(--warning-light); color:var(--warning);}
.pri.YELLOW .dot{background:var(--warning);}
.pri.GREEN{background:var(--success-light); color:var(--success);}
.pri.GREEN .dot{background:var(--success);}
.status-pill{background:var(--bg); color:var(--ink-soft); font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; text-align:center;}

.detail-grid{display:grid; grid-template-columns:2fr 1fr; gap:18px;}
@media(max-width:1000px){.detail-grid{grid-template-columns:1fr;}}
.d-section{margin-bottom:18px;}
.d-section h5{font-family:var(--font-display); font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--primary-dark); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
.d-editable{width:100%; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; font-family:var(--font-body); resize:vertical; min-height:44px; color:var(--ink); background:var(--bg);}
.d-editable:focus{outline:none; border-color:var(--primary); background:#fff;}
.source-tag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; margin-top:6px;}
.src-patient{background:var(--primary-light); color:var(--primary-dark);}
.src-caregiver{background:#F1E9FB; color:#6B3FA0;}
.src-document{background:var(--success-light); color:var(--success);}
.src-ai{background:var(--warning-light); color:var(--warning);}
.field-actions{display:flex; gap:6px; margin-top:8px;}
.mini-btn{font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--ink-soft);}
.mini-btn.accept{color:var(--success); border-color:var(--success);}
.mini-btn.reject{color:var(--danger); border-color:var(--danger);}

.timeline{position:relative; padding-left:20px;}
.timeline::before{content:'';position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--border);}
.t-item{position:relative; margin-bottom:16px;}
.t-item::before{content:''; position:absolute; left:-20px; top:3px; width:12px; height:12px; border-radius:50%; background:var(--primary); border:2px solid #fff; box-shadow:0 0 0 1px var(--primary);}
.t-item .t-date{font-size:11px; font-weight:700; color:var(--primary-dark); text-transform:uppercase;}
.t-item .t-txt{font-size:13.5px; margin-top:2px;}

.bar-chart{display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:10px;}
.bar-chart .b{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:8px;}
.bar-chart .b .fill{width:100%; background:linear-gradient(180deg,var(--primary),var(--primary-dark)); border-radius:8px 8px 0 0;}
.bar-chart .b .lbl{font-size:11px; color:var(--ink-soft); font-weight:600;}
.bar-chart .b .val{font-size:11.5px; font-weight:700; color:var(--ink);}

.badge{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.3px;}
.badge-ayush{background:#EAF6EC; color:#2E7D42;}
.badge-return{background:#EDE7F6; color:#5E35B1;}
.badge-mock{background:var(--warning-light); color:var(--warning);}

.empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
.empty-state .ic{font-size:38px; margin-bottom:10px;}
</style>
</head>
<body class="hi">

<div class="rolebar">
  <div class="brand"><span class="dot"></span> SwasthSetu <span style="opacity:.6;font-weight:500;">| AI Clinical Intake Platform</span></div>
  <nav id="roleNav"></nav>
  <div class="meta">
    <span class="badge-live"><span class="pulse"></span> SIH Demo Mode</span>
    <span id="clockMeta"></span>
  </div>
</div>

<div id="app"></div>

<div class="access-fab" id="accessFab"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SWASTHSETU — single-file prototype
   Roles: patient (kiosk) | doctor | triage | admin
   ============================================================ */

const T = {
  hi: {
    namaste:"नमस्ते! आइए आपकी स्वास्थ्य जानकारी तैयार करें।",

/* ================= APP STATE + CORE ================= */
const App = {
  state:{
    role:"patient",
    lang:"hi",
    senior:false, highContrast:false, zeroLit:false,
    flow:{ step:0, mode:null, complaintKey:null, answers:{}, redFlag:null, docs:[], consent:false },
    queue: seedQueue(),
    selectedQueueId:null,
    dashTab:"queue",
    listening:false, heardText:"",
    toastMsg:"",
  },

  init(){
    this.renderRoleNav();
    this.renderAccessFab();
    this.tick();
    this.render();
  },

  tick(){
    const now = new Date();
    document.getElementById('clockMeta').textContent = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    setTimeout(()=>this.tick(), 30000);
  },

  t(key){ return (T[this.state.lang]||T.hi)[key]; },
  L(obj){ return obj[this.state.lang] || obj.hi || obj.en; },

  setRole(r){ this.state.role=r; this.state.dashTab='queue'; this.render(); },

  showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(()=>el.classList.remove('show'), 2600);
  },

  toggleSenior(){ this.state.senior=!this.state.senior; document.body.classList.toggle('senior-mode', this.state.senior); this.renderAccessFab(); },
  toggleContrast(){ this.state.highContrast=!this.state.highContrast; document.body.classList.toggle('high-contrast', this.state.highContrast); this.renderAccessFab(); },
  toggleZeroLit(){ this.state.zeroLit=!this.state.zeroLit; this.renderAccessFab(); this.render(); },
  setLang(l){ this.state.lang=l; document.body.classList.toggle('hi', l==='hi'); this.render(); },

  speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = this.state.lang==='hi' ? 'hi-IN' : 'en-IN';
      u.rate = this.state.senior ? 0.82 : 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  },

  /* ---------- render dispatcher ---------- */
  render(){
    const app = document.getElementById('app');
    if(this.state.role==='patient'){ app.innerHTML = this.renderPatientKiosk(); }
    else { app.innerHTML = this.renderDashboard(); }
    this.renderRoleNav();
  },

  renderRoleNav(){
    const roles = [
      {id:'patient', l:'🧑 Patient Kiosk'},
      {id:'doctor', l:'🩺 Doctor'},
      {id:'triage', l:'🚨 Triage'},
      {id:'admin', l:'📊 Admin'},
    ];
    document.getElementById('roleNav').innerHTML = roles.map(r=>
      `<button class="${this.state.role===r.id?'active':''}" onclick="App.setRole('${r.id}')">${r.l}</button>`
    ).join('');
  },

  renderAccessFab(){
    document.getElementById('accessFab').innerHTML = `
      <button title="Senior / Large text mode" class="${this.state.senior?'on':''}" onclick="App.toggleSenior()">🔠</button>
      <button title="High contrast" class="${this.state.highContrast?'on':''}" onclick="App.toggleContrast()">🌓</button>
      <button title="Zero-literacy mode" class="${this.state.zeroLit?'on':''}" onclick="App.toggleZeroLit()">🖼️</button>
    `;
  },

  /* ================= PATIENT KIOSK FLOW ================= */
  goStep(n){ this.state.flow.step = n; this.render(); window.scrollTo(0,0); },
  resetFlow(){ this.state.flow = { step:0, mode:null, complaintKey:null, answers:{}, redFlag:null, docs:[], consent:false }; this.render(); },

  progressBar(total,current){
    let html='<div class="k-progress">';
    for(let i=0;i<total;i++){
      const cls = i<current ? 'done' : (i===current?'now':'');
      html += `<span class="${cls}"><i></i></span>`;
    }
    return html+'</div>';
  },

  renderPatientKiosk(){
    const f = this.state.flow;
    let inner = '';
    switch(f.step){
      case 0: inner = this.pkLanguage(); break;
      case 1: inner = this.pkConsent(); break;
      case 2: inner = this.pkHome(); break;
      case 3: inner = this.pkVoiceIntake(); break;
      case 4: inner = this.pkBodyMap(); break;
      case 5: inner = this.pkQuestion(); break;
      case 6: inner = this.pkRedFlag(); break;
      case 7: inner = this.pkDocs(); break;
      case 8: inner = this.pkMissingInfo(); break;
      case 9: inner = this.pkSummaryConfirm(); break;
      case 10: inner = this.pkReceipt(); break;
      default: inner = this.pkLanguage();
    }
    return `<div class="kiosk-wrap"><div class="kiosk-card ${[3,5,7,9].includes(f.step)?'wide':''}"><div class="kiosk-topstrip"></div><div class="kiosk-body">${inner}</div></div></div>`;
  },

  pkLanguage(){
    const langs = [{id:'hi',l:'हिंदी'},{id:'en',l:'English'},{id:'pa',l:'ਪੰਜਾਬੀ'},{id:'mr',l:'मराठी'},{id:'ta',l:'தமிழ்'},{id:'bn',l:'বাংলা'}];
    return `
      <div class="k-eyebrow">Step 1 of 5 · Language</div>
      <div class="k-title">${this.t('namaste')}</div>
      <div class="k-sub">${this.t('chooseLang')}</div>
      <div class="chiprow">
        ${langs.map(x=>`<button class="chip ${this.state.lang===x.id?'selected':''}" onclick="App.setLang('${x.id}'); App.showToast('Language set: ${x.l}')">${x.l}</button>`).join('')}
      </div>
      <div class="k-actions">
        <button class="btn btn-primary btn-full btn-lg" onclick="App.goStep(1)">${this.t('start')} →</button>
      </div>
      <div class="k-footer-links">
        <span>🌐 ${langs.length}+ भाषाएं समर्थित — regional languages architecture-ready</span>
      </div>`;
  },

  pkConsent(){
    return `
      <div class="k-eyebrow">Step 2 of 5 · Consent</div>
      <div class="k-title">${this.state.lang==='hi'?'आपकी सहमति ज़रूरी है':'Your consent is required'}</div>
      <div class="k-sub">${this.state.lang==='hi'?'हम आपकी जानकारी सुरक्षित रखेंगे। सुनने के लिए 🔊 दबाएं।':'We will keep your information secure. Tap 🔊 to listen.'}</div>
      <div class="consent-box">
        ${this.state.lang==='hi'
          ? 'हम आपकी आवाज़, आपके जवाब और आपके पुराने मेडिकल दस्तावेज़ों को डॉक्टर के लिए एक सारांश बनाने हेतु प्रोसेस करेंगे। यह जानकारी केवल अधिकृत अस्पताल स्टाफ और आपके डॉक्टर के साथ साझा होगी। आप कभी भी अपनी सहमति वापस ले सकते हैं। सेशन खत्म होते ही अस्थायी डेटा हटा दिया जाएगा। (DPDP Act 2023 अनुपालित)'
          : 'We will process your voice, your answers, and your old medical documents to create a summary for the doctor. This information will only be shared with authorised hospital staff and your doctor. You may withdraw consent at any time. Temporary session data is cleared immediately after submission. (DPDP Act 2023 compliant)'}
      </div>
      <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="App.speak(document.querySelector('.consent-box').textContent)">${this.t('repeat')}</button>
      <label class="consent-check"><input type="checkbox" id="consentChk"> ${this.state.lang==='hi'?'मैं सहमति देता/देती हूँ कि मेरी जानकारी ऊपर बताए अनुसार उपयोग हो।':'I consent to my information being used as described above.'}</label>
      <div class="k-actions">
        <button class="btn btn-outline" onclick="App.goStep(0)">← ${this.t('back')}</button>
        <button class="btn btn-primary btn-full" onclick="App.confirmConsent()">${this.t('next')} →</button>
      </div>`;
  },
  confirmConsent(){
    const chk = document.getElementById('consentChk');
    if(!chk.checked){ this.showToast(this.state.lang==='hi'?'कृपया सहमति बॉक्स चुनें':'Please check the consent box'); return; }
    this.state.flow.consent = true; this.goStep(2);
  },

  pkHome(){
    return `
      <div class="k-eyebrow">Step 3 of 5 · Home</div>
      <div class="k-title">${this.t('namaste')}</div>
      <div class="k-sub">${this.state.lang==='hi'?'आप कैसे बताना चाहेंगे?':'How would you like to tell us?'}</div>
      <div class="grid2" style="margin-bottom:14px;">
        <button class="tile big" onclick="App.startVoice()"><span class="ic">🎤</span>${this.t('voiceMode')}</button>
        <button class="tile big" onclick="App.goStep(4)"><span class="ic">👆</span>${this.t('touchMode')}</button>
      </div>
      <div class="grid2">
        <button class="tile" onclick="App.showToast('${this.state.lang==='hi'?'परिवार सहायता मोड चालू':'Caregiver mode enabled'}')"><span class="ic">👨‍👩‍👧</span>${this.t('caregiver')}</button>
        <button class="tile emergency" onclick="App.triggerAssistance()"><span class="ic">🆘</span>${this.t('emergency')}</button>
      </div>
      <div class="k-footer-links">
        <button onclick="App.goStep(1)">← ${this.t('back')}</button>
        <span>♿ ${this.state.lang==='hi'?'सुविधाओं के लिए नीचे दाएं बटन देखें':'See accessibility buttons bottom-right'}</span>
      </div>`;
  },
  triggerAssistance(){
    const tok = "OPD-"+Math.floor(Math.random()*90+10);
    this.showToast(this.state.lang==='hi'?`🆘 स्टाफ को सूचित किया गया — टोकन ${tok}`:`🆘 Staff notified — token ${tok}`);
  },

  startVoice(){ this.state.flow.mode='voice'; this.state.listening=false; this.state.heardText=''; this.goStep(3); },

  pkVoiceIntake(){
    const supported = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
    return `
      <div class="k-eyebrow">Step 3 of 5 · Voice Intake</div>
      <div class="k-title">${this.state.lang==='hi'?'बताइए, आपको क्या तकलीफ है?':'Tell us, what is troubling you?'}</div>
      <div class="k-sub">${this.state.lang==='hi'?'जैसे: "मुझे सीने में दर्द है" या "मुझे बुखार है"':'For example: "I have chest pain" or "I have fever"'}</div>
      <div class="mic-zone">
        <button class="mic-btn ${this.state.listening?'listening':''}" onclick="App.toggleListen()"><span class="mic-ring"></span>🎤</button>
        <div class="mic-caption">${this.state.listening ? this.t('listening') : this.t('tapMic')}</div>
        <div class="mic-heard">${this.state.heardText || ''}</div>
        ${!supported ? `<div style="font-size:12px;color:var(--warning);margin-top:4px;">⚠️ ${this.state.lang==='hi'?'इस ब्राउज़र में वॉइस सपोर्ट नहीं — कृपया शरीर मानचित्र से चुनें':'Voice not supported in this browser — please use body map instead'}</div>` : ''}
      </div>
      <div class="k-actions">
        <button class="btn btn-outline" onclick="App.goStep(2)">← ${this.t('back')}</button>
        <button class="btn btn-ghost btn-full" onclick="App.goStep(4)">${this.state.lang==='hi'?'या शरीर मानचित्र से चुनें':'Or pick from body map'} →</button>
      </div>`;
  },

  toggleListen(){
    const SR = window.webkitSpeechRecognition || window.SpeechRecognition;
    if(!SR){ this.showToast(this.state.lang==='hi'?'वॉइस सपोर्ट नहीं मिला':'Voice not supported'); return; }
    if(this.state.listening){ this._rec && this._rec.stop(); return; }
    this._rec = new SR();
    this._rec.lang = this.state.lang==='hi' ? 'hi-IN' : 'en-IN';
    this._rec.interimResults = false;
    this._rec.maxAlternatives = 1;
    this.state.listening = true; this.render();
    this._rec.onresult = (e)=>{
      const text = e.results[0][0].transcript;
      this.state.heardText = text;
      this.state.listening = false;
      let matched = null;
      for(const key in KEYWORDS){
        if(KEYWORDS[key].some(k=>text.toLowerCase().includes(k.toLowerCase()))){ matched = key; break; }
      }
      this.render();
      if(matched){
        setTimeout(()=>{ this.selectComplaint(matched); }, 700);
      } else {
        this.showToast(this.state.lang==='hi'?'समझ नहीं आया — कृपया शरीर मानचित्र चुनें':'Could not detect — please choose from body map');
      }
    };
    this._rec.onerror = ()=>{ this.state.listening=false; this.render(); };
    this._rec.onend = ()=>{ this.state.listening=false; this.render(); };
    try{ this._rec.start(); }catch(e){ this.state.listening=false; }
  },

  pkBodyMap(){
    return `
      <div class="k-eyebrow">Step 3 of 5 · Body Map</div>
      <div class="k-title">${this.state.lang==='hi'?'कहाँ तकलीफ है? छूकर बताएं':'Where does it hurt? Tap to tell us'}</div>
      <div class="bodymap-wrap">
        ${BODY_PARTS.map(p=>`<button class="bm-part ${this.state.flow.complaintKey===p.tree?'selected':''}" onclick="App.selectComplaint('${p.tree}')"><span class="ic">${p.ic}</span>${this.L(p.l)}</button>`).join('')}
      </div>
      <div class="k-footer-links">
        <button onclick="App.goStep(2)">← ${this.t('back')}</button>
      </div>`;
  },

  selectComplaint(treeKey){
    this.state.flow.complaintKey = treeKey;
    this.state.flow.qIndex = 0;
    this.state.flow.answers = {};
    this.state.flow.redFlag = null;
    this.goStep(5);
  },

  pkQuestion(){
    const f = this.state.flow;
    const tree = TREES[f.complaintKey];
    const qi = f.qIndex || 0;
    if(qi >= tree.q.length){ return this.pkAfterQuestions(); }
    const q = tree.q[qi];
    const questionText = this.state.zeroLit ? this.L(q.text) : this.L(q.text);
    let body = '';
    if(q.yn){
      body = `<div class="opt-list">
        <button class="opt-btn" onclick="App.answerQ('${q.id}','yes','${q.flagIf||''}')"><span>👍 ${this.t('yes')}</span><span class="yn"></span></button>
        <button class="opt-btn" onclick="App.answerQ('${q.id}','no','')"><span>👎 ${this.t('no')}</span><span class="yn"></span></button>
      </div>`;
    } else {
      body = `<div class="opt-list">
        ${q.opts.map(o=>`<button class="opt-btn" onclick="App.answerQ('${q.id}','${o.v}','')">${this.L(o.l)}</button>`).join('')}
      </div>`;
    }
    return `
      <div class="k-eyebrow">${this.L(tree.label)} · ${qi+1}/${tree.q.length}</div>
      ${this.progressBar(tree.q.length, qi)}
      <div class="q-card">
        <div class="q-text">${questionText}</div>
        ${body}
        <div class="util-row">
          <button onclick="App.speak('${questionText.replace(/'/g,"")}')">${this.t('repeat')}</button>
          <button onclick="App.answerQ('${q.id}','skip','')">${this.t('skip')}</button>
          ${qi>0?`<button onclick="App.prevQ()">← ${this.t('back')}</button>`:''}
        </div>
      </div>`;
  },
  prevQ(){ this.state.flow.qIndex = Math.max(0,(this.state.flow.qIndex||0)-1); this.render(); },
  answerQ(id, val, flagIf){
    this.state.flow.answers[id] = val;
    if(flagIf && val===flagIf){
      const tree = TREES[this.state.flow.complaintKey];
      // count flag-worthy answers to decide severity, but for demo any one flagged yn triggers pathway check
      this.state.flow._flagHit = (this.state.flow._flagHit||0)+1;
    }
    this.state.flow.qIndex = (this.state.flow.qIndex||0)+1;
    const tree = TREES[this.state.flow.complaintKey];
    if(this.state.flow.qIndex >= tree.q.length){
      if(this.state.flow._flagHit >= 2){
        this.state.flow.redFlag = this.L(tree.flagMsg);
        this.goStep(6);
        return;
      }
    }
    this.render();
  },
  pkAfterQuestions(){ this.goStep(7); return ''; },

  pkRedFlag(){
    const f = this.state.flow;
    return `
      <div class="alert-emergency">
        <div class="ic">⚠️</div>
        <h2>${this.state.lang==='hi'?'संभावित इमरजेंसी लक्षण पाए गए':'Potential Emergency Symptoms Detected'}</h2>
        <p>${this.state.lang==='hi'?'कृपया शांत रहें। स्टाफ को तुरंत सूचित किया जा रहा है।':'Please stay calm. Staff is being alerted immediately.'}</p>
        <p style="font-weight:700; margin-top:10px;">${f.redFlag}</p>
        <div class="tag">🚨 ${this.state.lang==='hi'?'ट्राइएज को अलर्ट भेजा गया':'Alert sent to Triage Dashboard'}</div>
      </div>
      <div style="font-size:12px; color:var(--ink-soft); text-align:center; margin-top:14px;">
        ${this.state.lang==='hi'?'नोट: यह डायग्नोसिस नहीं है। अंतिम निर्णय डॉक्टर करेंगे।':'Note: This is not a diagnosis. Final decision rests with the doctor.'}
      </div>
      <div class="k-actions">
        <button class="btn btn-danger btn-full btn-lg" onclick="App.pushRedFlagToTriage(); App.goStep(7)">${this.state.lang==='hi'?'ठीक है, आगे बढ़ें':'Understood, continue'} →</button>
      </div>`;
  },
  pushRedFlagToTriage(){
    this.showToast(this.state.lang==='hi'?'🚨 ट्राइएज डैशबोर्ड पर अलर्ट भेजा गया':'🚨 Alert pushed to Triage Dashboard');
  },

  pkDocs(){
    const f = this.state.flow;
    return `
      <div class="k-eyebrow">Step 4 of 5 · Document Scan</div>
      <div class="k-title">${this.state.lang==='hi'?'पुराने मेडिकल दस्तावेज़ जोड़ें':'Add your old medical documents'}</div>
      <div class="k-sub">${this.state.lang==='hi'?'प्रिस्क्रिप्शन, रिपोर्ट या डिस्चार्ज समरी अपलोड करें (डेमो — असली स्कैनर हार्डवेयर पर कैमरा इस्तेमाल होगा)':'Upload prescriptions, reports or discharge summaries (demo — real deployment uses kiosk camera)'} <span class="badge badge-mock">MOCK OCR</span></div>
      <div class="doc-drop">📄 ${this.state.lang==='hi'?'नीचे डेमो दस्तावेज़ चुनें':'Pick a demo document below'}</div>
      ${DEMO_DOCS.map((d,i)=>`<button class="demo-doc-btn" onclick="App.addDoc(${i})"><span>${d.ic}</span> ${this.L(d.name)} <span style="margin-left:auto;font-size:11px;color:var(--ink-soft);">+ ${this.t('next')==='आगे बढ़ें'?'जोड़ें':'Add'}</span></button>`).join('')}
      ${f.docs.length ? `<div style="margin-top:14px;">${f.docs.map(d=>`
        <div class="doc-item"><div class="thumb">${d.ic}</div><div class="info"><b>${this.L(d.name)}</b>${d.fields.map(x=>`<div>${x.k}: ${x.v} <span class="conf-tag ${x.c>=90?'conf-high':'conf-low'}">${x.c}%</span></div>`).join('')}</div></div>
      `).join('')}</div>` : ''}
      <div class="k-actions">
        <button class="btn btn-outline" onclick="App.goStep(2)">${this.state.lang==='hi'?'दस्तावेज़ नहीं हैं':'No documents'}</button>
        <button class="btn btn-primary btn-full" onclick="App.goStep(8)">${this.t('next')} →</button>
      </div>`;
  },
  addDoc(i){
    const d = DEMO_DOCS[i];
    if(!this.state.flow.docs.find(x=>x.name.en===d.name.en)) this.state.flow.docs.push(d);
    this.render();
    this.showToast(this.state.lang==='hi'?'✓ दस्तावेज़ जोड़ा और स्कैन किया गया':'✓ Document added and scanned');
  },

  pkMissingInfo(){
    const f = this.state.flow;
    const answered = Object.keys(f.answers).filter(k=>f.answers[k]!=='skip').length;
    const total = TREES[f.complaintKey] ? TREES[f.complaintKey].q.length : 6;
    const pct = Math.min(97, Math.round(((answered/total)*0.6 + (f.docs.length>0?0.25:0.05) + 0.15)*100));
    const missing = [];
    if(!f.docs.length) missing.push(this.state.lang==='hi'?'कोई पुराना दस्तावेज़ नहीं जोड़ा गया':'No prior documents added');
    if(Object.values(f.answers).includes('skip')) missing.push(this.state.lang==='hi'?'कुछ सवाल छोड़े गए':'Some questions were skipped');
    missing.push(this.state.lang==='hi'?'एलर्जी की जानकारी सत्यापित नहीं':'Allergy information not verified');
    this.state.flow.completeness = pct;
    return `
      <div class="k-eyebrow">Step 4 of 5 · Completeness Check</div>
      <div class="k-title">${this.state.lang==='hi'?'जानकारी की जांच हो रही है':'Checking your information'}</div>
      <div class="completeness-ring"><div class="num">${pct}%</div><div style="font-size:13.5px;color:var(--ink-soft);">${this.state.lang==='hi'?'History Completeness — AI द्वारा गणना':'History Completeness — calculated by AI'}</div></div>
      <div class="d-section"><h5>${this.state.lang==='hi'?'गायब जानकारी':'Missing Information'}</h5>
      ${missing.map(m=>`<div class="sum-block">⚠️ ${m}</div>`).join('')}</div>
      <div class="k-actions">
        <button class="btn btn-primary btn-full btn-lg" onclick="App.goStep(9)">${this.t('next')} →</button>
      </div>`;
  },

  pkSummaryConfirm(){
    const f = this.state.flow;
    const tree = TREES[f.complaintKey];
    const ansLines = tree ? tree.q.map(q=>{
      const a = f.answers[q.id];
      if(!a || a==='skip') return null;
      let label = q.yn ? (a==='yes'?this.t('yes'):this.t('no')) : this.L((q.opts.find(o=>o.v===a)||{l:{hi:a,en:a}}).l);
      return `${this.L(q.text)} — <b>${label}</b>`;
    }).filter(Boolean) : [];
    return `
      <div class="k-eyebrow">Step 5 of 5 · Confirm</div>
      <div class="k-title">${this.state.lang==='hi'?'कृपया अपनी जानकारी जांचें':'Please confirm your information'}</div>
      <div class="k-sub">🔊 ${this.state.lang==='hi'?'हमने जो समझा वो सुनिए, अगर सही है तो ठीक है दबाएं':'Listen to what we understood; confirm if correct'}</div>
      ${ansLines.map(l=>`<div class="sum-block">${l}</div>`).join('')}
      ${f.docs.length ? `<div class="sum-block">📄 ${f.docs.length} ${this.state.lang==='hi'?'दस्तावेज़ जोड़े गए':'documents added'}</div>` : ''}
      <div class="k-actions">
        <button class="btn btn-ghost" onclick="App.speak('${ansLines.join('. ').replace(/<[^>]+>/g,'').replace(/'/g,'')}')">${this.t('repeat')}</button>
        <button class="btn btn-outline" onclick="App.goStep(5)">${this.state.lang==='hi'?'सुधारें':'Correct something'}</button>
        <button class="btn btn-primary btn-full" onclick="App.finalizeSubmission()">✓ ${this.state.lang==='hi'?'सही है, जमा करें':'Correct, Submit'}</button>
      </div>`;
  },

  finalizeSubmission(){
    const f = this.state.flow;
    const tok = "OPD-"+Math.floor(Math.random()*900+100);
    this._lastToken = tok;
    const priority = f.redFlag ? 'RED' : 'GREEN';
    this.state.queue.unshift({
      id: tok, name: this.state.lang==='hi'?'नया मरीज़ (कियोस्क)':'New Patient (Kiosk)', age:'-', sex:'-', lang:this.state.lang,
      mode: this.state.flow.mode==='voice' ? 'Voice Intake' : 'Touch Intake', complaintKey: f.complaintKey,
      complaintLabel: TREES[f.complaintKey] ? this.L(TREES[f.complaintKey].label) : '—',
      priority, status: f.redFlag ? 'Red Flag — Awaiting Staff' : 'Ready for Doctor',
      time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),
      redflag: f.redFlag, ayush:false, returning:false,
      summary:{
        cc:{v:(TREES[f.complaintKey]?this.L(TREES[f.complaintKey].label):'—'), src:'patient'},
        hpi:{v:Object.entries(f.answers).map(([k,v])=>`${k}: ${v}`).join(', ')||'—', src:'patient'},
        past:{v:'Not captured this session', src:'ai'},
        drug:{v: f.docs.length? f.docs.map(d=>d.fields.filter(x=>x.k==='Medicine').map(x=>x.v).join(', ')).join(', ')||'None extracted':'None reported', src: f.docs.length?'document':'patient'},
        allergy:{v:'Not verified', src:'ai'},
        family:{v:'Not captured this session', src:'ai'},
        personal:{v:'Not captured this session', src:'ai'},
        ros:{v:'Derived from adaptive questionnaire', src:'ai'},
      },
      completeness: f.completeness || 70,
      missing:['Allergy history not verified','Family history not captured'],
      docs: f.docs, timeline:[{d:'आज / Today', t:'Kiosk intake — '+ (TREES[f.complaintKey]?this.L(TREES[f.complaintKey].label):'')}]
    });
    this.goStep(10);
  },

  pkReceipt(){
    return `
      <div class="k-eyebrow">${this.state.lang==='hi'?'पूर्ण हुआ':'Complete'}</div>
      <div class="k-title">${this.state.lang==='hi'?'धन्यवाद! आपकी जानकारी डॉक्टर को भेज दी गई है':'Thank you! Your information has been sent to the doctor'}</div>
      <div class="receipt">
        <div style="font-size:13px;color:var(--ink-soft);">${this.state.lang==='hi'?'आपका टोकन नंबर':'Your token number'}</div>
        <div class="token">${this._lastToken||'OPD-000'}</div>
        <div class="qr"></div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:8px;">${this.state.lang==='hi'?'यह QR आपकी सहमति रसीद है':'This QR is your consent receipt'}</div>
      </div>
      <div class="k-actions">
        <button class="btn btn-primary btn-full btn-lg" onclick="App.resetFlow()">${this.state.lang==='hi'?'नया मरीज़ / समाप्त करें':'New Patient / Finish'}</button>
      </div>
      <div class="k-footer-links"><span>👉 ${this.state.lang==='hi'?'"डॉक्टर" या "ट्राइएज" टैब पर जाकर देखें कि आपकी जानकारी डैशबोर्ड पर कैसे दिखती है':'Switch to the Doctor / Triage tab above to see this appear on the dashboard'}</span></div>`;
  },

  /* ================= DASHBOARDS ================= */
  renderDashboard(){
    const role = this.state.role;
    const items = [
      {id:'queue', l:'📋 Patient Queue', roles:['doctor','triage']},
      {id:'triage', l:'🚨 Triage Alerts', roles:['triage','doctor']},
      {id:'admin', l:'📊 Analytics', roles:['admin']},
      {id:'wow', l:'✨ Innovation Layer', roles:['doctor','triage','admin']},
    ].filter(i=>i.roles.includes(role));
    if(!items.find(i=>i.id===this.state.dashTab)) this.state.dashTab = items[0].id;

    const redCount = this.state.queue.filter(q=>q.priority==='RED').length;
    const yellowCount = this.state.queue.filter(q=>q.priority==='YELLOW').length;

    let content = '';
    if(role==='admin' && this.state.dashTab==='admin') content = this.adminAnalytics();
    else if(this.state.dashTab==='wow') content = this.wowLayer();
    else if(role==='triage' || this.state.dashTab==='triage') content = this.triageView();
    else content = this.state.selectedQueueId ? this.doctorDetail() : this.doctorQueueList();

    return `
      <div class="dash-wrap">
        <div class="sidebar">
          <h4>Navigate</h4>
          ${items.map(i=>`<div class="side-item ${this.state.dashTab===i.id?'active':''}" onclick="App.setDashTab('${i.id}')">${i.l} ${i.id==='queue'?`<span class="cnt">${this.state.queue.length}</span>`:''}${i.id==='triage'?`<span class="cnt">${redCount+yellowCount}</span>`:''}</div>`).join('')}
          <h4>Demo Patients</h4>
          ${this.state.queue.slice(0,5).map(p=>`<div class="side-item" onclick="App.setRole('doctor'); App.openPatient('${p.id}')">${p.priority==='RED'?'🔴':(p.priority==='YELLOW'?'🟡':'🟢')} ${p.id}</div>`).join('')}
        </div>
        <div class="dash-main">${content}</div>
      </div>`;
  },
  setDashTab(t){ this.state.dashTab = t; this.state.selectedQueueId=null; this.render(); },
  openPatient(id){ this.state.selectedQueueId = id; this.state.dashTab='queue'; this.render(); },

  doctorQueueList(){
    const q = this.state.queue;
    return `
      <div class="dash-header"><div><h1>Patient Queue</h1><p>Structured histories ready for physician review — AI assists, doctor decides.</p></div>
      <span class="badge-live" style="background:var(--primary-light); color:var(--primary-dark);">${q.length} in queue</span></div>
      <div class="panel">
        <div class="p-head">Today's OPD Queue <span style="font-weight:500; color:var(--ink-soft);">Sorted by priority</span></div>
        <div class="p-body" style="padding:0;">
          <div class="queue-row" style="font-weight:700; color:var(--ink-soft); font-size:11.5px; text-transform:uppercase;">
            <span>Token</span><span>Patient / Complaint</span><span>Priority</span><span>Status</span><span>Time</span>
          </div>
          ${[...q].sort((a,b)=> (a.priority==='RED'?0:a.priority==='YELLOW'?1:2) - (b.priority==='RED'?0:b.priority==='YELLOW'?1:2)).map(p=>`
          <div class="queue-row" onclick="App.openPatient('${p.id}')">
            <span class="token-tag">${p.id}</span>
            <span>${p.name} <span style="color:var(--ink-soft);">— ${p.complaintLabel}</span> ${p.ayush?'<span class="badge badge-ayush">AYUSH</span>':''} ${p.returning?'<span class="badge badge-return">Returning</span>':''}</span>
            <span class="pri ${p.priority}"><span class="dot"></span>${p.priority}</span>
            <span class="status-pill">${p.status}</span>
            <span style="color:var(--ink-soft);">${p.time}</span>
          </div>`).join('')}
        </div>
      </div>`;
  },

  doctorDetail(){
    const p = this.state.queue.find(x=>x.id===this.state.selectedQueueId);
    if(!p) return this.doctorQueueList();
    const s = p.summary;
    const srcClass = {patient:'src-patient', caregiver:'src-caregiver', document:'src-document', ai:'src-ai'};
    const srcLabel = {patient:'Patient reported', caregiver:'Caregiver reported', document:'Document extracted', ai:'AI structured'};
    const field = (label, obj)=>`
      <div class="d-section">
        <h5>${label} <span class="source-tag ${srcClass[obj.src]}">${srcLabel[obj.src]}</span></h5>
        <textarea class="d-editable">${obj.v}</textarea>
        <div class="field-actions">
          <button class="mini-btn accept">✓ Accept</button>
          <button class="mini-btn">✎ Edit</button>
          <button class="mini-btn reject">✕ Reject</button>
        </div>
      </div>`;
    return `
      <button class="btn btn-outline" style="margin-bottom:16px;" onclick="App.state.selectedQueueId=null; App.render();">← Back to Queue</button>
      <div class="dash-header">
        <div><h1>${p.name} <span style="font-weight:500;color:var(--ink-soft);font-size:14px;">· ${p.age!== '-' ? p.age+'y ':''}${p.sex!=='-'?p.sex:''} · ${p.id}</span></h1>
        <p>${p.mode} · Language: ${p.lang} · Visit: ${p.time} ${p.ayush?'<span class="badge badge-ayush">AYUSH Mode</span>':''} ${p.returning?'<span class="badge badge-return">Returning Patient</span>':''}</p></div>
        <span class="pri ${p.priority}"><span class="dot"></span>${p.priority} PRIORITY</span>
      </div>
      ${p.redflag ? `<div class="panel" style="border:1.5px solid var(--danger);"><div class="p-body" style="background:var(--danger-light); display:flex; align-items:center; gap:10px;"><span style="font-size:22px;">🚨</span><div><b style="color:var(--danger);">Red Flag Detected:</b> ${p.redflag}<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">AI flagged this pattern for urgent review — not an automated diagnosis.</div></div></div></div>` : ''}
      <div class="detail-grid">
        <div>
          <div class="panel"><div class="p-head">Structured Clinical History <span style="font-weight:500;color:var(--ink-soft);">AI Confidence: ${p.completeness}%</span></div>
          <div class="p-body">
            ${field('Chief Complaint', s.cc)}
            ${field('History of Present Illness', s.hpi)}
            ${field('Past Medical / Surgical History', s.past)}
            ${field('Drug History', s.drug)}
            ${field('Allergy History', s.allergy)}
            ${field('Family History', s.family)}
            ${field('Personal History', s.personal)}
            ${field('Review of Systems', s.ros)}
          </div></div>
        </div>
        <div>
          <div class="panel"><div class="p-head">History Completeness</div><div class="p-body">
            <div class="completeness-ring"><div class="num">${p.completeness}%</div><div style="font-size:12.5px;color:var(--ink-soft);">Complete</div></div>
            ${p.missing.map(m=>`<div class="sum-block">⚠️ ${m}</div>`).join('')}
          </div></div>
          <div class="panel"><div class="p-head">Medical Timeline</div><div class="p-body">
            <div class="timeline">${p.timeline.map(t=>`<div class="t-item"><div class="t-date">${t.d}</div><div class="t-txt">${t.t}</div></div>`).join('')}</div>
          </div></div>
          ${p.docs.length? `<div class="panel"><div class="p-head">Source Documents</div><div class="p-body">
            ${p.docs.map(d=>`<div class="doc-item"><div class="thumb">${d.ic}</div><div class="info"><b>${this.L(d.name)}</b>${d.fields.map(x=>`<div>${x.k}: ${x.v} <span class="conf-tag ${x.c>=90?'conf-high':'conf-low'}">${x.c}%</span></div>`).join('')}</div></div>`).join('')}
          </div></div>` : ''}
          <div class="panel"><div class="p-body" style="display:flex; gap:8px;">
            <button class="btn btn-primary btn-full" onclick="App.showToast('Summary accepted & saved to EMR (mock ABDM/FHIR push)')">✓ Accept & Save</button>
          </div></div>
        </div>
      </div>`;
  },

  triageView(){
    const q = [...this.state.queue].sort((a,b)=> (a.priority==='RED'?0:a.priority==='YELLOW'?1:2) - (b.priority==='RED'?0:b.priority==='YELLOW'?1:2));
    return `
      <div class="dash-header"><div><h1>Triage Dashboard</h1><p>Real-time red-flag alerts from all active kiosk sessions.</p></div></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="lbl">🔴 Red — Immediate</div><div class="val">${q.filter(x=>x.priority==='RED').length}</div></div>
        <div class="stat-card"><div class="lbl">🟡 Yellow — Needs Review</div><div class="val">${q.filter(x=>x.priority==='YELLOW').length}</div></div>
        <div class="stat-card"><div class="lbl">🟢 Green — Routine</div><div class="val">${q.filter(x=>x.priority==='GREEN').length}</div></div>
        <div class="stat-card"><div class="lbl">Active Kiosks</div><div class="val">6</div></div>
      </div>
      <div class="panel"><div class="p-head">Alert Queue</div><div class="p-body" style="padding:0;">
        ${q.map(p=>`
          <div class="queue-row" style="grid-template-columns:70px 1fr 140px 110px 130px;">
            <span class="token-tag">${p.id}</span>
            <span>${p.name} <span style="color:var(--ink-soft);">— ${p.redflag || p.complaintLabel}</span></span>
            <span class="pri ${p.priority}"><span class="dot"></span>${p.priority}</span>
            <span style="color:var(--ink-soft);">${p.time}</span>
            <button class="mini-btn ${p.priority==='RED'?'accept':''}" onclick="App.showToast('Staff acknowledged ${p.id}'); App.render();">Acknowledge</button>
          </div>`).join('')}
      </div></div>`;
  },

  adminAnalytics(){
    const langDist = {hi:52, en:21, mr:12, pa:9, other:6};
    const maxL = Math.max(...Object.values(langDist));
    return `
      <div class="dash-header"><div><h1>Hospital Admin Dashboard</h1><p>Operational analytics across all kiosks — today.</p></div></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="lbl">Patients Processed</div><div class="val">312</div><div class="sub">▲ 18% vs yesterday</div></div>
        <div class="stat-card"><div class="lbl">Avg Intake Duration</div><div class="val">4.2m</div><div class="sub">vs 12m manual triage</div></div>
        <div class="stat-card"><div class="lbl">Avg Doctor Review</div><div class="val">48s</div><div class="sub">vs 4-5m unassisted</div></div>
        <div class="stat-card"><div class="lbl">Red-Flag Cases</div><div class="val">7</div><div class="sub" style="color:var(--danger);">2 awaiting staff</div></div>
      </div>
      <div class="detail-grid">
        <div class="panel"><div class="p-head">Language Distribution</div><div class="p-body">
          <div class="bar-chart">
            ${Object.entries(langDist).map(([k,v])=>`<div class="b"><div class="val">${v}%</div><div class="fill" style="height:${(v/maxL)*110}px;"></div><div class="lbl">${k.toUpperCase()}</div></div>`).join('')}
          </div>
        </div></div>
        <div class="panel"><div class="p-head">Kiosk Utilization</div><div class="p-body">
          ${['Kiosk 1','Kiosk 2','Kiosk 3','Kiosk 4'].map((k,i)=>`
            <div style="margin-bottom:14px;"><div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;"><b>${k}</b><span>${[88,64,92,41][i]}%</span></div>
            <div style="height:8px; background:var(--bg); border-radius:6px; overflow:hidden;"><div style="height:100%; width:${[88,64,92,41][i]}%; background:var(--primary); border-radius:6px;"></div></div></div>
          `).join('')}
        </div></div>
      </div>
      <div class="panel"><div class="p-head">Document Processing</div><div class="p-body">
        <div class="stat-grid" style="margin-bottom:0;">
          <div class="stat-card"><div class="lbl">Documents Scanned</div><div class="val">146</div></div>
          <div class="stat-card"><div class="lbl">Avg OCR Confidence</div><div class="val">93%</div></div>
          <div class="stat-card"><div class="lbl">Incomplete Histories</div><div class="val">23</div></div>
          <div class="stat-card"><div class="lbl">Paper Forms Saved</div><div class="val">~300/day</div></div>
        </div>
      </div></div>`;
  },

  wowLayer(){
    const feats = [
      ['🗣️','Zero-Literacy Voice Mode','Full audio-guided flow, no reading required'],
      ['🧍','Interactive Body Map','Tap-to-describe symptom location'],
      ['🌳','Adaptive Questioning','SOCRATES-style branching per complaint, not a fixed form'],
      ['🧩','Missing-Info Detector','AI flags only genuine gaps, never re-asks answered items'],
      ['📊','Completeness Score','Transparent breakdown per history section'],
      ['🔍','OCR Confidence + Source Tags','Every AI field traceable to its origin'],
      ['🕒','Auto Medical Timeline','Documents chronologically organized'],
      ['🔁','Change Detection','Returning patients — only "what changed" is asked'],
      ['👨‍👩‍👧','Caregiver Mode','Distinguishes patient vs caregiver vs AI-sourced answers'],
      ['📡','Offline-First','Session survives poor hospital connectivity'],
      ['🚨','Red-Flag Triage Alerts','Emergency patterns bypass the queue instantly'],
      ['🕉️','AYUSH Dashavidha Mode','Prakriti/Vikriti/Agni assessment for Ayurvedic OPDs'],
      ['♿','Accessibility Suite','Senior mode, high contrast, screen-reader ready'],
      ['🧾','Digital Consent Receipt','QR-based, DPDP Act 2023 compliant'],
      ['🏥','ABDM/FHIR-Ready APIs','Mock-labeled, drop-in ready for real credentials'],
    ];
    return `
      <div class="dash-header"><div><h1>✨ Innovation Layer</h1><p>What makes SwasthSetu different from a generic check-in kiosk — all live in this prototype, not slideware.</p></div></div>
      <div class="stat-grid">
        ${feats.map(f=>`<div class="stat-card"><div style="font-size:24px; margin-bottom:8px;">${f[0]}</div><div class="lbl" style="font-size:13px; color:var(--ink); font-weight:700; margin-bottom:4px;">${f[1]}</div><div style="font-size:12px; color:var(--ink-soft);">${f[2]}</div></div>`).join('')}
      </div>`;
  },
};

document.addEventListener('DOMContentLoaded', ()=> App.init());
</script>
</body>
</html>
